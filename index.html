<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Toadstool Robotics</title>
<meta name="description" content="Toadstool Robotics LLC designs and builds robotics and outdoor hardware in Maryland.">
<meta property="og:title" content="Toadstool Robotics">
<meta property="og:description" content="Robotics and outdoor hardware, designed and built in Maryland.">
<meta property="og:image" content="https://toadstoolrobotics.com/og.png">
<meta name="theme-color" content="#f4ebdd" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1a22" media="(prefers-color-scheme: dark)">
<link rel="icon" href="mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
  :root {
    --ground: #f4ebdd;
    --ink: #1e2b24;
    --muted: #5b6159;
    --red: #c9432f;
    --gold: #e0a93b;
    --line: #d6c8b1;
    --grid: rgba(30, 43, 36, .055);
    --shadow: rgba(0, 0, 0, .14);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #1c1a22;
      --ink: #f4ebdd;
      --muted: #a8a196;
      --red: #e0573f;
      --line: #37323f;
      --grid: rgba(244, 235, 221, .04);
      --shadow: rgba(0, 0, 0, .4);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background-color: var(--ground);
    /* graph paper, fading out toward the edges */
    background-image:
      radial-gradient(ellipse at 50% 42%, transparent 0, transparent 38%, var(--ground) 82%),
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 100% 100%, 24px 24px, 24px 24px;
    background-position: 0 0, -1px -1px, -1px -1px;
    color: var(--ink);
    font: 400 17px/1.6 "IBM Plex Sans", system-ui, -apple-system, sans-serif;
    padding: max(14px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom));
  }
  /* the page is drawn like a workshop sheet: a frame with corner ticks and a title strip */
  .sheet {
    position: relative;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    border: 1px solid var(--line);
    padding: clamp(20px, 5vw, 56px);
  }
  .sheet::before, .sheet::after {
    content: ""; position: absolute; width: 14px; height: 14px; border: 2px solid var(--red); pointer-events: none;
  }
  .sheet::before { top: -2px; left: -2px; border-right: 0; border-bottom: 0; }
  .sheet::after { bottom: -2px; right: -2px; border-left: 0; border-top: 0; }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: clamp(22px, 4vw, 34px);
    width: 100%;
    max-width: 700px;
    margin: 0 auto;
  }
  h1 { margin: 0; line-height: 0; }
  .logo { display: block; width: 100%; max-width: 560px; height: auto; overflow: visible; }
  .logo .ink { fill: var(--ink); }
  .logo .ink-stroke { stroke: var(--ink); }
  .logo .ground-shadow { fill: var(--shadow); }
  .logo .mascot { cursor: pointer; }
  .logo .mascot:focus { outline: none; }
  .logo .mascot:focus-visible .cap { stroke: var(--gold); stroke-width: 2; }

  /* personality: the sparkle twinkles, the eyes blink and glance about */
  .spark { transform-box: fill-box; transform-origin: center; animation: twinkle 3.6s ease-in-out infinite; }
  .zap .spark { animation: zap .7s cubic-bezier(.3, 1.6, .5, 1); }
  .eye { transform-box: fill-box; transform-origin: center; animation: blink 6.5s infinite; }
  .eye.r { animation-delay: .04s; }
  .pupils { animation: glance 11s ease-in-out infinite; }
  .tracking .pupils { animation: none; transition: transform .12s ease-out; }
  @keyframes twinkle {
    0%, 100% { transform: scale(1) rotate(0); opacity: 1; }
    45% { transform: scale(.72) rotate(18deg); opacity: .75; }
    60% { transform: scale(1.18) rotate(-6deg); opacity: 1; }
  }
  @keyframes zap { from { transform: scale(.4) rotate(-90deg); } to { transform: scale(1) rotate(180deg); } }
  @keyframes blink { 0%, 95.5%, 100% { transform: scaleY(1); } 97.5% { transform: scaleY(.08); } }
  @keyframes glance {
    0%, 30%, 100% { transform: translate(0, 0); }
    36%, 52% { transform: translate(-3.4px, .8px); }
    58%, 74% { transform: translate(1.6px, 2.4px); }
    80% { transform: translate(0, 0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .spark, .eye, .pupils { animation: none; }
    .tracking .pupils { transition: none; }
  }

  p.lede { margin: 0; max-width: 34ch; font-size: clamp(18px, 2.6vw, 22px); line-height: 1.5; color: var(--muted); text-wrap: pretty; }
  p.lede b { font-weight: 500; color: var(--ink); }

  /* title strip, like the corner of a drawing */
  .strip {
    display: grid;
    grid-template-columns: repeat(3, auto);
    justify-content: start;
    border: 1px solid var(--line);
    width: fit-content;
    max-width: 100%;
    background: var(--ground);
  }
  .cell { padding: 12px 18px 13px; border-left: 1px solid var(--line); display: flex; flex-direction: column; gap: 7px; min-width: 0; }
  .cell:first-child { border-left: 0; }
  .label { font: 500 10.5px/1 "IBM Plex Mono", ui-monospace, monospace; letter-spacing: .26em; text-transform: uppercase; color: var(--muted); }
  .value { font-size: 15.5px; line-height: 1.25; overflow-wrap: anywhere; }
  .value .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); margin-right: 8px; vertical-align: 1px; animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .value .dot { animation: none; } }
  @media (max-width: 560px) {
    .strip { grid-template-columns: 1fr 1fr; width: 100%; }
    .cell.contact { grid-column: 1 / -1; border-left: 0; border-bottom: 1px solid var(--line); }
    .cell.status { border-left: 0; }
  }
  a { color: var(--ink); text-decoration-color: var(--red); text-underline-offset: 4px; text-decoration-thickness: 2px; }
  a:hover { text-decoration-color: var(--gold); }
  a:focus-visible { outline: 2px solid var(--red); outline-offset: 3px; border-radius: 2px; }
  footer {
    display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 24px;
    max-width: 700px; width: 100%; margin: 36px auto 0;
    font: 500 11px/1.4 "IBM Plex Mono", ui-monospace, monospace; letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
  }
</style>
</head>

<script>
(function () {
  var m = document.getElementById('mascot');
  if (!m) return;
  var svg = m.ownerSVGElement, pupils = m.querySelectorAll('.pupils');
  var calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var eyes = [[37, 51], [83, 51]], idle;
  function look(e) {
    if (calm || e.pointerType === 'touch') return;
    var ctm = m.getScreenCTM();
    if (!ctm) return;
    var p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
    var q = p.matrixTransform(ctm.inverse());
    svg.classList.add('tracking');
    for (var i = 0; i < 2; i++) {
      var dx = q.x - eyes[i][0], dy = q.y - eyes[i][1], d = Math.hypot(dx, dy) || 1;
      var r = Math.min(4, d / 14);
      /* pupils rest slightly up and right of centre, so pull back by that offset */
      pupils[i].style.transform = 'translate(' + (dx / d * r - 1.5).toFixed(2) + 'px,' + (dy / d * r + 1.5).toFixed(2) + 'px)';
    }
    clearTimeout(idle);
    idle = setTimeout(function () {
      svg.classList.remove('tracking');
      for (var i = 0; i < 2; i++) pupils[i].style.transform = '';
    }, 4000);
  }
  window.addEventListener('pointermove', look, { passive: true });
  function zap() {
    if (calm) return;
    svg.classList.remove('zap'); void svg.getBoundingClientRect(); svg.classList.add('zap');
    setTimeout(function () { svg.classList.remove('zap'); }, 750);
  }
  m.addEventListener('click', zap);
  m.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); zap(); } });
})();
</script>
