<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Toadstool Robotics</title>
<meta name="description" content="Toadstool Robotics LLC designs and builds robotics and outdoor hardware in Maryland.">
<meta property="og:title" content="Toadstool Robotics">
<meta property="og:description" content="Robotics and outdoor hardware, designed and built in Maryland.">
<meta property="og:image" content="https://toadstoolrobotics.com/og.png">
<link rel="icon" href="mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
  :root {
    --ground: #f4ebdd;
    --ink: #1e2b24;
    --muted: #5b6159;
    --red: #c9432f;
    --line: #ddd0bc;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #1c1a22;
      --ink: #f4ebdd;
      --muted: #a8a196;
      --red: #e0573f;
      --line: #322e39;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--ground);
    color: var(--ink);
    font: 400 17px/1.6 "IBM Plex Sans", system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    padding: max(24px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
  }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 32px;
    width: 100%;
    max-width: 640px;
    margin: 0 auto;
  }
  h1 { margin: 0; line-height: 0; }
  h1 img { display: block; width: 100%; max-width: 520px; height: auto; }
  p.lede { margin: 0; max-width: 36ch; font-size: clamp(18px, 2.6vw, 21px); color: var(--muted); }
  .contact {
    display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline;
    padding-top: 22px; border-top: 1px solid var(--line);
  }
  .label { font: 500 12px/1 "IBM Plex Mono", ui-monospace, monospace; letter-spacing: .28em; text-transform: uppercase; color: var(--muted); }
  a { color: var(--ink); text-decoration-color: var(--red); text-underline-offset: 4px; text-decoration-thickness: 2px; }
  a:focus-visible { outline: 2px solid var(--red); outline-offset: 3px; border-radius: 2px; }
  footer { max-width: 640px; width: 100%; margin: 40px auto 0; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>
    <picture>
      <source srcset="logo-dark.svg" media="(prefers-color-scheme: dark)">
      <img src="logo.svg" alt="Toadstool Robotics" width="1043" height="306">
    </picture>
  </h1>
  <p class="lede">Robotics and outdoor hardware, designed and built in Maryland. Something is on the bench &mdash; more soon.</p>
  <div class="contact">
    <span class="label">Contact</span>
    <a href="mailto:hello@toadstoolrobotics.com">hello@toadstoolrobotics.com</a>
  </div>
</main>
<footer>&copy; 2026 Toadstool Robotics LLC</footer>
</body>
</html>
